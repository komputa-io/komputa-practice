<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The life of a program</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#F4F3EF; --color-ink:#111111; --color-muted:#5E5E5A; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:720px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:'Outfit',sans-serif; font-size:clamp(1.5rem,2.4vw + 0.75rem,2.25rem); font-weight:700; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:640px; display:block; }
    .arr { stroke:#5E5E5A; stroke-width:1.5; fill:none; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Komputa agent practice</p>
    <h1>The life of a program</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 640 722" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="life-title life-desc">
<title id="life-title">The life of a program</title>
<desc id="life-desc">Five steps of one session, from plan to hand over, top to bottom, each with the rule or check that holds it.</desc>
<defs><marker id="life-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5E5A"/></marker></defs>
<rect width="100%" height="100%" fill="#F4F3EF"/>
<line x1="320" y1="112" x2="320" y2="143" class="arr" marker-end="url(#life-arrow)"/>
<line x1="320" y1="232" x2="320" y2="263" class="arr" marker-end="url(#life-arrow)"/>
<line x1="320" y1="352" x2="320" y2="383" class="arr" marker-end="url(#life-arrow)"/>
<line x1="320" y1="472" x2="320" y2="503" class="arr" marker-end="url(#life-arrow)"/>
<rect x="40" y="24" width="560" height="88" rx="6" fill="#F4F3EF"/><rect x="40" y="24" width="560" height="88" rx="6" fill="#FFFFFF" stroke="#8A8883"/><text x="60" y="56" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">01</text><text x="60" y="88" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#111111">Plan</text><text x="330" y="64" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">tier and size stated</text><text x="330" y="88" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">tier table in the rules</text>
<rect x="40" y="144" width="560" height="88" rx="6" fill="#F4F3EF"/><rect x="40" y="144" width="560" height="88" rx="6" fill="#FFFFFF" stroke="#8A8883"/><text x="60" y="176" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">02</text><text x="60" y="208" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#111111">Build</text><text x="330" y="184" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">tests follow risk</text><text x="330" y="208" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">hooks and the gate</text>
<rect x="40" y="264" width="560" height="88" rx="6" fill="#F4F3EF"/><rect x="40" y="264" width="560" height="88" rx="6" fill="#FF5A1F" stroke="#C2410C"/><text class="on-accent" x="60" y="296" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">03</text><text class="on-accent" x="60" y="328" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#111111">Verify</text><text class="on-accent" x="330" y="304" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">verifier subagent</text><text class="on-accent" x="330" y="328" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">runs the real artifact</text>
<rect x="40" y="384" width="560" height="88" rx="6" fill="#F4F3EF"/><rect x="40" y="384" width="560" height="88" rx="6" fill="#FF5A1F" stroke="#C2410C"/><text class="on-accent" x="60" y="416" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">04</text><text class="on-accent" x="60" y="448" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#111111">Merge</text><text class="on-accent" x="330" y="424" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">checks at the head SHA</text><text class="on-accent" x="330" y="448" font-family="JetBrains Mono, monospace" font-size="16" fill="#111111">yes for a live change</text>
<rect x="40" y="504" width="560" height="88" rx="6" fill="#F4F3EF"/><rect x="40" y="504" width="560" height="88" rx="6" fill="#FFFFFF" stroke="#8A8883"/><text x="60" y="536" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">05</text><text x="60" y="568" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#111111">Hand over</text><text x="330" y="544" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">handoff near 250k</text><text x="330" y="568" font-family="JetBrains Mono, monospace" font-size="16" fill="#5E5E5A">fresh session starts</text>
<text x="40" y="632" font-family="Inter, sans-serif" font-size="18" fill="#111111">Read from top to bottom. The two orange steps are where the</text>
<text x="40" y="656" font-family="Inter, sans-serif" font-size="18" fill="#111111">work is checked by something other than its author.</text>
<line x1="40" y1="676" x2="600" y2="676" stroke="#DDDBD5"/>
<rect x="40" y="694" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#8A8883"/>
<text x="68" y="706" font-family="JetBrains Mono, monospace" font-size="14" fill="#5E5E5A">Step</text>
<rect x="150" y="694" width="18" height="14" rx="2" fill="#FF5A1F" stroke="#C2410C"/>
<text x="178" y="706" font-family="JetBrains Mono, monospace" font-size="14" fill="#5E5E5A">Focal: checked by something other than the author</text>
</svg>
    </div>
  </div>
</body>
</html>
