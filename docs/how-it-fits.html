<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the pieces fit</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F4F3EF; color: #111111; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; padding: 3rem 2rem; }
    .frame { max-width: 1040px; margin: 0 auto; }
    h1 { font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
    .node { fill: #FFFFFF; stroke: #111111; stroke-width: 1.25; }
    .focal { fill: #FF5A1F; stroke: #C2410C; stroke-width: 1.25; }
    .name { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #111111; text-anchor: middle; }
    .sub { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; fill: #5E5E5A; text-anchor: middle; }
    .on-accent { fill: #111111; }
    .arr { fill: none; stroke: #5E5E5A; stroke-width: 1.25; }
    .label { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #5E5E5A; text-anchor: middle; }
    .zone { fill: none; stroke: #8A8883; stroke-width: 1; stroke-dasharray: 5,4; }
    .eyebrow { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; fill: #5E5E5A; text-anchor: middle; }
  </style>
</head>
<body>
  <main class="frame">
    <h1>How the pieces fit</h1>
    <div class="scroll">
      <svg viewBox="0 0 1040 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-fits-title how-it-fits-desc">
        <title id="how-it-fits-title">How the pieces fit</title>
        <desc id="how-it-fits-desc">The practice repo's rules, hooks and skills reach your Claude Code setup, which the session loads with pstack's roles; the session sends pull requests to your repo, which the project template started.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#5E5E5A"/>
          </marker>
        </defs>

        <rect width="1040" height="440" fill="#F4F3EF"/>

        <!-- zone: the practice repo -->
        <rect class="zone" x="24" y="164" width="228" height="252" rx="8"/>
        <rect x="54" y="156" width="168" height="16" fill="#F4F3EF"/>
        <text class="eyebrow" x="138" y="169">PRACTICE REPO</text>

        <!-- arrows first -->
        <line class="arr" x1="236" y1="232" x2="298" y2="232" marker-end="url(#arrow)"/>
        <line class="arr" x1="496" y1="232" x2="558" y2="232" marker-end="url(#arrow)"/>
        <line class="arr" x1="756" y1="232" x2="818" y2="232" marker-end="url(#arrow)"/>
        <path class="arr" d="M496,100 H650 Q658,100 658,108 V194" marker-end="url(#arrow)"/>
        <path class="arr" d="M236,364 H910 Q918,364 918,356 V270" marker-end="url(#arrow)"/>

        <!-- arrow labels on paper masks, above their lines -->
        <rect x="256" y="202" width="40" height="16" fill="#F4F3EF"/>
        <text class="label" x="276" y="215">LINK</text>
        <rect x="500" y="202" width="56" height="16" fill="#F4F3EF"/>
        <text class="label" x="528" y="215">LOADS</text>
        <rect x="768" y="202" width="40" height="16" fill="#F4F3EF"/>
        <text class="label" x="788" y="215">PR</text>
        <rect x="668" y="132" width="56" height="16" fill="#F4F3EF"/>
        <text class="label" x="696" y="145">ROLES</text>
        <rect x="536" y="334" width="64" height="16" fill="#F4F3EF"/>
        <text class="label" x="568" y="347">COPIER</text>

        <!-- nodes -->
        <rect class="node" x="40" y="196" width="196" height="72" rx="6"/>
        <text class="name" x="138" y="229">Rules, hooks, skills</text>
        <text class="sub" x="138" y="251">rules/ hooks/ skills/</text>

        <rect class="node" x="40" y="328" width="196" height="72" rx="6"/>
        <text class="name" x="138" y="361">Project template</text>
        <text class="sub" x="138" y="383">copier.yml template/</text>

        <rect class="node" x="300" y="196" width="196" height="72" rx="6"/>
        <text class="name" x="398" y="229">Your agent setup</text>
        <text class="sub" x="398" y="251">~/.claude/</text>

        <rect class="node" x="300" y="64" width="196" height="72" rx="6"/>
        <text class="name" x="398" y="97">pstack</text>
        <text class="sub" x="398" y="119">models, playbooks</text>

        <rect class="focal" x="560" y="196" width="196" height="72" rx="6"/>
        <text class="name on-accent" x="658" y="229">Claude Code</text>
        <text class="sub on-accent" x="658" y="251">plan, build, verify</text>

        <rect class="node" x="820" y="196" width="196" height="72" rx="6"/>
        <text class="name" x="918" y="229">Your repo</text>
        <text class="sub" x="918" y="251">CLAUDE.md, gate, CI</text>
      </svg>
    </div>
  </main>
</body>
</html>
