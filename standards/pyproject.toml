[project]
name = "project-standards"
version = "0.1.0"
description = "Tests for the project-standards Copier template."
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "copier>=9.18,<10",
    "shellcheck-py>=0.11,<1",
    "shfmt-py>=4.2,<5",
    "ruff>=0.16,<0.17",
    "pyright[nodejs]>=1.1.414,<2",
    "pytest-socket>=0.8,<0.9",
    "pytest-xdist>=3.8.0,<4",
]

[tool.uv]
# The seven-day cooldown is in uv.toml.
package = false
